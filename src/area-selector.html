<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영역 선택</title>
  <link rel="stylesheet" href="./area-selector.css">
</head>
<body>
  <div id="hint" class="hint">
    <span>드래그로 영역 생성, 박스 이동/모서리 리사이즈, Enter 적용, ESC 취소</span>
    <button id="fillDisplayButton" type="button">이 모니터 전체</button>
  </div>

  <div id="selection" class="selection">
    <span class="handle nw" data-handle="nw"></span>
    <span class="handle ne" data-handle="ne"></span>
    <span class="handle sw" data-handle="sw"></span>
    <span class="handle se" data-handle="se"></span>
  </div>

  <div id="actions" class="actions">
    <button id="cancelButton" type="button">취소</button>
    <button id="applyButton" class="primary" type="button">적용</button>
  </div>

  <script src="./area-selector.js"></script>
</body>
</html>
