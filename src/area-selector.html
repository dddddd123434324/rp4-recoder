<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영역 선택</title>
  <style>
    :root {
      --accent: #ff2d0a;
      font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
      background: rgba(0, 0, 0, 0.18);
    }

    .hint {
      position: fixed;
      left: 50%;
      top: 26px;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transform: translateX(-50%);
      padding: 9px 10px;
      border: 1px solid rgba(255, 45, 10, 0.72);
      border-radius: 8px;
      background: rgba(5, 6, 7, 0.88);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      color: #f5f7fa;
      font-size: 13px;
      font-weight: 800;
    }

    .hint button,
    .actions button {
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid #30343c;
      border-radius: 6px;
      background: #12151a;
      color: #f5f7fa;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .hint button:hover,
    .actions button:hover {
      border-color: rgba(255, 45, 10, 0.8);
    }

    .actions {
      position: fixed;
      right: 26px;
      bottom: 26px;
      z-index: 5;
      display: flex;
      gap: 8px;
    }

    .actions button.primary {
      border-color: rgba(255, 45, 10, 0.9);
      background: linear-gradient(180deg, #ff4a17, #f22b08);
    }

    .display-border {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 45, 10, 0.5);
      pointer-events: none;
    }

    .selection {
      position: absolute;
      display: none;
      min-width: 32px;
      min-height: 32px;
      border: 2px solid var(--accent);
      background: rgba(255, 45, 10, 0.1);
      box-shadow:
        0 0 0 1px #000,
        0 0 24px rgba(255, 45, 10, 0.42);
      cursor: move;
      touch-action: none;
    }

    .selection.active {
      display: block;
    }

    .selection::after {
      content: attr(data-size);
      position: absolute;
      left: 0;
      bottom: calc(100% + 8px);
      padding: 5px 8px;
      border: 1px solid rgba(255, 45, 10, 0.64);
      border-radius: 6px;
      background: rgba(5, 6, 7, 0.88);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .handle {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid #050607;
      background: var(--accent);
    }

    .handle.nw {
      left: -8px;
      top: -8px;
      cursor: nwse-resize;
    }

    .handle.ne {
      right: -8px;
      top: -8px;
      cursor: nesw-resize;
    }

    .handle.sw {
      left: -8px;
      bottom: -8px;
      cursor: nesw-resize;
    }

    .handle.se {
      right: -8px;
      bottom: -8px;
      cursor: nwse-resize;
    }
  </style>
</head>
<body>
  <div class="display-border"></div>
  <div class="hint">
    <span>드래그로 영역 생성, 박스 이동/모서리 리사이즈, Enter 적용, ESC 취소</span>
    <button id="fullButton" type="button">전체 화면</button>
  </div>
  <div id="selection" class="selection">
    <span class="handle nw" data-handle="nw"></span>
    <span class="handle ne" data-handle="ne"></span>
    <span class="handle sw" data-handle="sw"></span>
    <span class="handle se" data-handle="se"></span>
  </div>
  <div class="actions">
    <button id="cancelButton" type="button">취소</button>
    <button id="applyButton" class="primary" type="button">적용</button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const selection = document.getElementById('selection');
    const applyButton = document.getElementById('applyButton');
    const cancelButton = document.getElementById('cancelButton');
    const fullButton = document.getElementById('fullButton');
    const params = new URLSearchParams(location.search);

    let displayData = null;
    let displayBounds = { x: 0, y: 0, width: 0, height: 0 };
    let rect = null;
    let drag = null;

    init();

    async function init() {
      displayData = await ipcRenderer.invoke('area-selector:data', params.get('displayId'));
      displayBounds = displayData.activeDisplay?.bounds || {
        x: 0,
        y: 0,
        width: window.innerWidth,
        height: window.innerHeight
      };

      window.addEventListener('pointerdown', beginPointer);
      window.addEventListener('pointermove', movePointer);
      window.addEventListener('pointerup', finishPointer);
      window.addEventListener('keydown', handleKey);
      applyButton.addEventListener('click', applySelection);
      cancelButton.addEventListener('click', cancelSelection);
      fullButton.addEventListener('click', selectFullScreen);
      selection.addEventListener('dblclick', applySelection);
      selectFullScreen();
    }

    function beginPointer(event) {
      if (event.button !== 0) return;
      if (event.target.closest('button')) return;

      const handle = event.target.dataset.handle || null;
      if (selection.contains(event.target) && rect) {
        drag = {
          mode: handle || 'move',
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          rect: { ...rect }
        };
        selection.setPointerCapture?.(event.pointerId);
        event.preventDefault();
        return;
      }

      rect = {
        x: event.clientX,
        y: event.clientY,
        width: 1,
        height: 1
      };
      drag = {
        mode: 'create',
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        rect: { ...rect }
      };
      selection.classList.add('active');
      drawSelection();
    }

    function movePointer(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;

      const dx = event.clientX - drag.startX;
      const dy = event.clientY - drag.startY;
      const start = drag.rect;

      if (drag.mode === 'create') {
        rect = normalizeRect({
          x: Math.min(drag.startX, event.clientX),
          y: Math.min(drag.startY, event.clientY),
          width: Math.abs(dx),
          height: Math.abs(dy)
        });
      } else if (drag.mode === 'move') {
        rect = normalizeRect({
          ...start,
          x: start.x + dx,
          y: start.y + dy
        });
      } else {
        rect = resizeRect(start, drag.mode, dx, dy);
      }

      drawSelection();
    }

    function finishPointer(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      selection.releasePointerCapture?.(event.pointerId);
      drag = null;
      rect = normalizeRect(rect);
      drawSelection();
    }

    function resizeRect(start, handle, dx, dy) {
      let left = start.x;
      let top = start.y;
      let right = start.x + start.width;
      let bottom = start.y + start.height;

      if (handle.includes('w')) left += dx;
      if (handle.includes('e')) right += dx;
      if (handle.includes('n')) top += dy;
      if (handle.includes('s')) bottom += dy;

      if (right - left < 32) {
        if (handle.includes('w')) left = right - 32;
        else right = left + 32;
      }
      if (bottom - top < 32) {
        if (handle.includes('n')) top = bottom - 32;
        else bottom = top + 32;
      }

      return normalizeRect({
        x: left,
        y: top,
        width: right - left,
        height: bottom - top
      });
    }

    function normalizeRect(value) {
      const width = Math.max(32, Math.min(window.innerWidth, value.width));
      const height = Math.max(32, Math.min(window.innerHeight, value.height));
      return {
        x: Math.max(0, Math.min(window.innerWidth - width, value.x)),
        y: Math.max(0, Math.min(window.innerHeight - height, value.y)),
        width,
        height
      };
    }

    function drawSelection() {
      if (!rect) return;
      selection.classList.add('active');
      selection.style.left = `${rect.x}px`;
      selection.style.top = `${rect.y}px`;
      selection.style.width = `${rect.width}px`;
      selection.style.height = `${rect.height}px`;
      selection.dataset.size = `${Math.round(rect.width)} x ${Math.round(rect.height)}`;
    }

    function selectFullScreen() {
      rect = {
        x: 0,
        y: 0,
        width: window.innerWidth,
        height: window.innerHeight
      };
      drawSelection();
    }

    function applySelection() {
      if (!rect) return;
      const scaleX = displayBounds.width / Math.max(1, window.innerWidth);
      const scaleY = displayBounds.height / Math.max(1, window.innerHeight);
      ipcRenderer.send('area-selector:complete', {
        x: Math.round(rect.x * scaleX + displayBounds.x),
        y: Math.round(rect.y * scaleY + displayBounds.y),
        width: Math.round(rect.width * scaleX),
        height: Math.round(rect.height * scaleY)
      });
    }

    function cancelSelection() {
      ipcRenderer.send('area-selector:cancel');
    }

    function handleKey(event) {
      if (event.key === 'Escape') {
        cancelSelection();
      }
      if (event.key === 'Enter') {
        applySelection();
      }
    }
  </script>
</body>
</html>
